plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.nutricompass'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.nutricompass"
        minSdk 32
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            // 从local.properties读取API密钥
            def localProperties = new Properties()
            def localPropertiesFile = rootProject.file('local.properties')
            if (localPropertiesFile.exists()) {
                localProperties.load(new FileInputStream(localPropertiesFile))
            }

            // 设置BuildConfig字段
            buildConfigField("String", "BAIDU_API_KEY", "\"${localProperties.getProperty('BAIDU_API_KEY', '')}\"")
            buildConfigField("String", "BAIDU_SECRET_KEY", "\"${localProperties.getProperty('BAIDU_SECRET_KEY', '')}\"")
            buildConfigField("String", "DEEPSEEK_API_KEY", "\"${localProperties.getProperty('DEEPSEEK_API_KEY', '')}\"")
            buildConfigField("String", "QWEATHER_API_KEY", "\"${localProperties.getProperty('QWEATHER_API_KEY', '')}\"")
        }

        release {
            // 同上，或者使用环境变量
            def localProperties = new Properties()
            def localPropertiesFile = rootProject.file('local.properties')
            if (localPropertiesFile.exists()) {
                localProperties.load(new FileInputStream(localPropertiesFile))
            }

            buildConfigField("String", "BAIDU_API_KEY", "\"${localProperties.getProperty('BAIDU_API_KEY', '')}\"")
            buildConfigField("String", "BAIDU_SECRET_KEY", "\"${localProperties.getProperty('BAIDU_SECRET_KEY', '')}\"")
            buildConfigField("String", "DEEPSEEK_API_KEY", "\"${localProperties.getProperty('DEEPSEEK_API_KEY', '')}\"")
            buildConfigField("String", "QWEATHER_API_KEY", "\"${localProperties.getProperty('QWEATHER_API_KEY', '')}\"")

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

configurations.all {
    resolutionStrategy {
        // 强制所有依赖都使用指定版本的 jna，并优先选择 'jar' 格式
        force 'net.java.dev.jna:jna:5.18.1'

    }
}
dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation(project(":lib"))
    // 添加网络相关依赖
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'

    // 如果需要更好的JSON处理
    implementation 'com.google.code.gson:gson:2.8.9'

    // 或者使用org.json
    implementation 'org.json:json:20210307'

    implementation 'com.alphacephei:vosk-android:0.3.47'
}